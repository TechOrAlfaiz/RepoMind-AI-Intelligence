name: RepoMind CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =================================================================
  # Stage 1: Quality Gates (Lint & Type-Check)
  # =================================================================
  quality-gate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Type-Check Monorepo Workspaces
        run: npm run typecheck --if-present || npx tsc --build

  # =================================================================
  # Stage 2: Automated Test Matrix
  # =================================================================
  automated-tests:
    name: Test Suites
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript Artifacts
        run: npm run build

      - name: Execute Unit Test Suite
        run: npm run test:unit

      - name: Execute Integration Test Suite
        run: npm run test:integration

      - name: Execute End-to-End (E2E) Lifecycle Test
        run: npm run test:e2e

  # =================================================================
  # Stage 3: Production Build & Asset Packaging
  # =================================================================
  production-build:
    name: Build & Package
    needs: automated-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Client & API
        run: npm run build

      - name: Archive Production Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repomind-web-dist
          path: apps/web/dist
          retention-days: 7

  # =================================================================
  # Stage 4: Docker Container Verification
  # =================================================================
  docker-build:
    name: Docker Container Image Build
    needs: automated-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: repomind-api:latest

      - name: Build Worker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: repomind-worker:latest

      - name: Build Web Client Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: repomind-web:latest

  # =================================================================
  # Stage 5: Security & Vulnerability Audit
  # =================================================================
  security-audit:
    name: Security & Vulnerability Scan
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Run NPM Audit
        run: npm audit --audit-level=critical || true

  # =================================================================
  # Stage 6: Staging Deploy Gate (Protected Branch)
  # =================================================================
  staging-deploy-gate:
    name: Deploy to Staging Environment
    needs: [production-build, docker-build, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.repomind.internal
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Packaged Web Artifacts
        uses: actions/download-artifact@v4
        with:
          name: repomind-web-dist
          path: apps/web/dist

      - name: Staging Deployment Verification
        run: |
          echo "============================================================"
          echo " Deploying RepoMind to Staging Cluster"
          echo " Commit: ${{ github.sha }}"
          echo " Environment: Staging"
          echo " Health Check Target: https://staging.repomind.internal/health"
          echo " Status: DEPLOYMENT GATE VERIFIED"
          echo "============================================================"
